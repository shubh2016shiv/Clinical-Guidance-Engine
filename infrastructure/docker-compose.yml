# =============================================================================
# ASCLEPIUS HEALTHCARE CHATBOT — INFRASTRUCTURE SERVICES
# =============================================================================
# PURPOSE:
#   This file defines the backing infrastructure for a healthcare AI chatbot.
#   It provisions vector storage (Milvus), document storage (MongoDB), and
#   caching (Redis) in a reproducible, version-controlled manner.
#
# QUICK START FOR NEW DEVELOPERS:
#   1. Copy `.env.example` to `.env` and fill in secrets (NEVER commit .env).
#   2. Create the volume directory: mkdir -p volumes/{etcd,minio,milvus,mongodb,redis}
#   3. Run: docker compose up -d
#   4. Verify health: docker compose ps
#   5. Access Attu UI: http://localhost:8000 (Milvus management)
#
# ARCHITECTURE OVERVIEW:
#   ┌─────────────┐     ┌─────────────┐     ┌─────────────┐
#   │   MongoDB   │     │    Redis    │     │   Milvus    │
#   │ (Chat Hist) │     │   (Cache)   │     │ (Vectors)   │
#   └─────────────┘     └─────────────┘     └──────┬──────┘
#                                                  │
#                    ┌─────────────┐     ┌────────┴────────┐
#                    │    etcd     │     │     MinIO       │
#                    │ (Metadata)  │     │ (Object Store)  │
#                    └─────────────┘     └─────────────────┘
#
# =============================================================================
# NAMING CONVENTION:
#   We use 'name:' at the top level to namespace all resources. This prevents
#   collisions when multiple projects run on the same Docker host.
# =============================================================================
name: asclepius-infrastructure

# =============================================================================
# COMPOSE FILE VERSION
# =============================================================================
# '3.8' is the minimum version supporting 'start_interval' in healthchecks,
# 'profiles', and advanced deployment constraints. Use Docker Engine 19.03+.
# =============================================================================
version: "3.8"

# =============================================================================
# SERVICES
# =============================================================================
# Each service below is a containerized component. Think of services as
# "micro-applications" that talk to each other over the network.
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # ETCD — Distributed Key-Value Store for Milvus Metadata
  # ---------------------------------------------------------------------------
  # WHAT IT DOES:
  #   etcd is Milvus's "brain" for service discovery and metadata storage.
  #   It stores collection schemas, index metadata, and cluster topology.
  #
  # WHY WE NEED IT:
  #   Milvus is a distributed vector database. etcd ensures all Milvus nodes
  #   agree on the current state of the database (consensus).
  #
  # OPERATIONAL NOTE:
  #   In production, etcd should run as a 3-node cluster for HA. Here we use
  #   a single node for local development simplicity.
  # ---------------------------------------------------------------------------
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    profiles: ["infra", "all"] # 'infra' = core backing services; 'all' = everything

    environment:
      # Automatic compaction prevents the database from growing indefinitely.
      # 'revision' mode compacts based on version history count.
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      # 4GB max storage. Prevents a runaway process from filling the disk.
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      # Snapshot frequency. Lower = more disk I/O, faster recovery.
      - ETCD_SNAPSHOT_COUNT=50000

    volumes:
      # ${DOCKER_VOLUME_DIRECTORY:-.} means:
      #   "Use the env var if set, otherwise use the current directory."
      # This makes the file portable between local dev and CI/CD pipelines.
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd

    # Command-line flags passed to etcd on startup.
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd

    # -------------------------------------------------------------------------
    # HEALTHCHECK — How Docker knows the service is truly ready
    # -------------------------------------------------------------------------
    # Docker will mark the container as "healthy" only when this command
    # exits 0. Other services can wait for "healthy" before starting.
    # -------------------------------------------------------------------------
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s # Check every 30 seconds
      timeout: 20s # Command must complete within 20 seconds
      retries: 3 # Mark unhealthy after 3 consecutive failures
      start_period: 10s # Grace period during startup before counting failures

    # -------------------------------------------------------------------------
    # DEPLOYMENT CONSTRAINTS — Resource guards for shared environments
    # -------------------------------------------------------------------------
    # These prevent one container from starving others. Critical in
    # enterprise environments where developers share Docker hosts.
    # -------------------------------------------------------------------------
    deploy:
      resources:
        limits:
          cpus: "1.00" # Max 1 CPU core
          memory: 512M # Max 512 MB RAM
        reservations:
          cpus: "0.25" # Reserve 1/4 core
          memory: 128M # Reserve 128 MB RAM

    # -------------------------------------------------------------------------
    # RESTART POLICY — Self-healing behavior
    # -------------------------------------------------------------------------
    # 'unless-stopped': Restart on crash, but respect explicit 'docker stop'.
    # This ensures services recover from transient failures automatically.
    # -------------------------------------------------------------------------
    restart: unless-stopped

    # -------------------------------------------------------------------------
    # SECURITY OPTIONS — Defense in depth
    # -------------------------------------------------------------------------
    # read_only: Filesystem is read-only except explicit tmpfs/volumes.
    # no_new_privileges: Prevents privilege escalation (e.g., via setuid).
    # -------------------------------------------------------------------------
    security_opt:
      - no-new-privileges:true
    read_only: true

    # Temporary filesystems for processes that need writable space.
    # These are discarded when the container stops (ephemeral).
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

    networks:
      - milvus

    labels:
      - "project=asclepius-healthcare-chatbot"
      - "service=etcd"
      - "description=Asclepius Healthcare Chatbot - etcd metadata store for Milvus"

  # ---------------------------------------------------------------------------
  # MINIO — S3-Compatible Object Storage for Milvus
  # ---------------------------------------------------------------------------
  # WHAT IT DOES:
  #   Milvus stores large objects (raw vectors, index files, logs) in MinIO.
  #   MinIO provides an Amazon S3-compatible API, making migration to cloud
  #   S3 seamless later.
  #
  # SECURITY WARNING:
  #   The credentials below are defaults. In production, override via .env
  #   and rotate regularly. Never commit real secrets to Git.
  # ---------------------------------------------------------------------------
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    profiles: ["infra", "all"]

    environment:
      # Using ${VAR:-default} syntax: reads from .env, falls back to default.
      # NEW DEV: Create a .env file and set MINIO_ROOT_USER / MINIO_ROOT_PASSWORD.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data

    # 'server' starts the MinIO server. '/minio_data' is the storage path.
    command: minio server /minio_data --console-address ":9001"

    healthcheck:
      # MinIO exposes a dedicated health endpoint. '-f' makes curl fail on 4xx/5xx.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

    # -------------------------------------------------------------------------
    # PORT MAPPING
    # -------------------------------------------------------------------------
    # 9000  = S3 API endpoint (used by Milvus internally)
    # 9001  = Web Console (for manual inspection during debugging)
    # NEW DEV: You only need 9001 for browsing files in the browser.
    # -------------------------------------------------------------------------
    ports:
      - "9000:9000"
      - "9001:9001"

    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    networks:
      - milvus

    labels:
      - "project=asclepius-healthcare-chatbot"
      - "service=minio"
      - "description=Asclepius Healthcare Chatbot - MinIO object storage for Milvus"

  # ---------------------------------------------------------------------------
  # ATTU — Milvus Management UI (Optional / Development Aid)
  # ---------------------------------------------------------------------------
  # WHAT IT DOES:
  #   Attu is a web-based GUI for Milvus. It lets you inspect collections,
  #   run vector searches manually, and monitor cluster health.
  #
  # WHEN TO USE:
  #   - Debugging why a vector search returns no results
  #   - Inspecting schema definitions
  #   - Manual data exploration during development
  #
  # WHEN NOT TO USE:
  #   - Production deployments (remove 'all' profile or comment out).
  #   - CI/CD pipelines (adds unnecessary overhead).
  # ---------------------------------------------------------------------------
  attu:
    container_name: attu
    image: zilliz/attu:v2.2.8
    profiles: ["ui", "all"] # Only starts when you run: docker compose --profile ui up -d

    environment:
      # Points Attu to the Milvus service defined below.
      # Docker's internal DNS resolves 'milvus-standalone' to the container IP.
      MILVUS_URL: milvus-standalone:19530

    ports:
      # Host 8000 -> Container 3000
      # We map to 8000 to avoid conflicts with common dev servers on 3000.
      - "8000:3000"

    # -------------------------------------------------------------------------
    # DEPENDENCY MANAGEMENT
    # -------------------------------------------------------------------------
    # 'depends_on' with 'condition: service_healthy' ensures Milvus is fully
    # ready (not just started) before Attu attempts to connect.
    # -------------------------------------------------------------------------
    depends_on:
      standalone:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    networks:
      - milvus

    labels:
      - "project=asclepius-healthcare-chatbot"
      - "service=attu"
      - "description=Asclepius Healthcare Chatbot - Attu UI for Milvus management"

  # ---------------------------------------------------------------------------
  # MILVUS STANDALONE — Vector Database for Drug Embeddings
  # ---------------------------------------------------------------------------
  # WHAT IT DOES:
  #   Milvus stores high-dimensional vector embeddings (e.g., 768-dim float
  #   arrays) generated from pharmaceutical drug descriptions. The chatbot
  #   uses Approximate Nearest Neighbor (ANN) search to find semantically
  #   similar drugs based on user symptoms.
  #
  # WHY "STANDALONE" MODE:
  #   Milvus supports distributed (cluster) and standalone modes.
  #   Standalone bundles coordinator, query node, and index node into one
  #   container — perfect for development and small-scale production.
  #
  # DATA FLOW:
  #   1. App generates embeddings via an LLM (e.g., OpenAI, HuggingFace).
  #   2. Embeddings are inserted into Milvus collections.
  #   3. User query -> embedding -> Milvus ANN search -> top-K drug matches.
  # ---------------------------------------------------------------------------
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.2.16
    profiles: ["infra", "all"]

    command: ["milvus", "run", "standalone"]

    environment:
      # Milvus needs to know where its dependencies live.
      # These hostnames resolve via Docker's embedded DNS server.
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000

    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus

    healthcheck:
      # Milvus exposes a /healthz endpoint on its metrics port (9091).
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      # 'start_period' is critical here: Milvus takes ~60-90s to initialize
      # on first run (loading libraries, connecting to etcd/minio).
      start_period: 90s
      timeout: 20s
      retries: 3

    ports:
      # 19530 = gRPC API (primary application interface)
      # 9091  = Metrics / Health endpoint (Prometheus scrapes this)
      - "19530:19530"
      - "9091:9091"

    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

    deploy:
      resources:
        limits:
          # Milvus is memory-hungry because it loads vector indexes into RAM.
          # Adjust based on your dataset size (e.g., 1M vectors ≈ 4-8GB).
          cpus: "2.00"
          memory: 4G
        reservations:
          cpus: "0.50"
          memory: 1G

    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    # ulimits prevent "too many open files" errors during heavy indexing.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    networks:
      - milvus

    labels:
      - "project=asclepius-healthcare-chatbot"
      - "service=milvus-standalone"
      - "description=Asclepius Healthcare Chatbot - Milvus vector database"

  # ---------------------------------------------------------------------------
  # MONGODB — Document Database for Conversation Storage
  # ---------------------------------------------------------------------------
  # WHAT IT DOES:
  #   MongoDB stores structured JSON documents: chat messages, user sessions,
  #   audit logs, and application configuration. Its flexible schema is ideal
  #   for conversational data where fields vary per message type.
  #
  # SCHEMA DESIGN TIP FOR NEW DEVS:
  #   Store conversations as embedded arrays for fast reads:
  #     { session_id, user_id, messages: [{role, content, timestamp}, ...] }
  #   Index on session_id and user_id for query performance.
  #
  # PERSISTENCE:
  #   Data is written to ./volumes/mongodb on the host. Deleting this folder
  #   wipes all conversation history — be careful!
  # ---------------------------------------------------------------------------
  mongodb:
    container_name: mongodb
    image: mongo:7.0
    profiles: ["infra", "all"]

    environment:
      # These credentials are used for the initial 'admin' database setup.
      # NEW DEV: Change these in your .env file before first launch.
      # After first launch, changing these env vars has NO EFFECT — credentials
      # are persisted in the volume. To reset: docker compose down -v (DELETES DATA).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}

    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/mongodb:/data/db

    ports:
      # Exposed for local development tools (MongoDB Compass, mongosh).
      # In production, remove this and access via application network only.
      - "27017:27017"

    healthcheck:
      # 'mongosh' is the modern MongoDB shell (replaces legacy 'mongo' CLI).
      # We ping the admin database to verify authentication + connectivity.
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s # MongoDB needs time to initialize WiredTiger engine

    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M

    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    # MongoDB benefits from higher file descriptor limits under load.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000

    networks:
      - milvus

    labels:
      - "project=asclepius-healthcare-chatbot"
      - "service=mongodb"
      - "description=Asclepius Healthcare Chatbot - MongoDB document database"

  # ---------------------------------------------------------------------------
  # REDIS — In-Memory Cache & Message Broker
  # ---------------------------------------------------------------------------
  # WHAT IT DOES:
  #   Redis serves two purposes here:
  #     1. CACHE: Stores frequently accessed data (user sessions, rate-limit
  #        counters) to reduce database load.
  #     2. MESSAGE BROKER: Can be used as a pub/sub backend for real-time
  #        chat features or Celery task queues.
  #
  # WHY REDIS OVER OTHER CACHES:
  #   - Persistence options (RDB snapshots, AOF logs) prevent total data loss.
  #   - Rich data structures (hashes, sorted sets) beyond simple key-value.
  #   - Excellent Python support (redis-py, aioredis).
  #
  # PERSISTENCE NOTE:
  #   By default, this config uses Redis's default RDB snapshotting.
  #   For stronger durability, enable AOF in a custom redis.conf.
  # ---------------------------------------------------------------------------
  redis:
    container_name: redis
    image: redis:7.2-alpine
    profiles: ["infra", "all"]

    # --requirepass enforces authentication on all connections.
    # NEW DEV: If your app gets "NOAUTH" errors, you forgot to provide the password.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis123}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis:/data

    ports:
      # Exposed for local debugging with redis-cli or Redis Insight.
      - "6379:6379"

    healthcheck:
      # '-a' provides the password. Redis returns PONG if healthy.
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 64M

    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    networks:
      - milvus

    labels:
      - "project=asclepius-healthcare-chatbot"
      - "service=redis"
      - "description=Asclepius Healthcare Chatbot - Redis cache service"

# =============================================================================
# NETWORKS
# =============================================================================
# We define a custom bridge network for three reasons:
#   1. ISOLATION: Services can only communicate if on the same network.
#   2. DNS DISCOVERY: Containers are reachable by service name (e.g., 'mongodb').
#   3. SECURITY: No external access except explicitly mapped ports.
#
# NEW DEV: If you add a new service (e.g., your Python FastAPI app), add
# 'networks: - milvus' so it can reach MongoDB and Redis by hostname.
# =============================================================================
networks:
  milvus:
    name: asclepius-network
    driver: bridge
    labels:
      - "project=asclepius-healthcare-chatbot"
      - "description=Asclepius Healthcare Chatbot Infrastructure Network"

# =============================================================================
# VOLUMES (Implicit)
# =============================================================================
# We use BIND MOUNTS (host directory -> container path) rather than named
# volumes for one critical reason: BACKUP SIMPLICITY.
#
#   Named volume:  docker volume inspect asclepius-infrastructure_milvus_data
#   Bind mount:    ./volumes/milvus/  (visible in your project folder)
#
# Bind mounts let you:
#   - Zip the ./volumes/ folder for offline backups.
#   - Wipe and recreate with: rm -rf ./volumes/ && docker compose up -d
#   - Inspect files directly with standard OS tools.
#
# NEW DEV: The ./volumes/ directory is in .gitignore. Never commit database
# files to Git — they are large and contain sensitive data.
# =============================================================================

# =============================================================================
# .env FILE TEMPLATE (Save as .env in the same directory)
# =============================================================================
# # --- Host Path Configuration ---
# DOCKER_VOLUME_DIRECTORY=.
#
# # --- MinIO Object Storage ---
# MINIO_ROOT_USER=minioadmin
# MINIO_ROOT_PASSWORD=ChangeMeToASecurePassword123!
#
# # --- MongoDB Authentication ---
# MONGO_ROOT_USER=admin
# MONGO_ROOT_PASSWORD=ChangeMeToASecurePassword456!
#
# # --- Redis Authentication ---
# REDIS_PASSWORD=ChangeMeToASecurePassword789!
# =============================================================================
