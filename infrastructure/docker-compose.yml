  #       soft: 64000
  #       hard: 64000

  #   networks:
  #     - milvus

  #   labels:
  #     - "project=asclepius-healthcare-chatbot"
  #     - "service=mongodb"
  #     - "description=Asclepius Healthcare Chatbot - MongoDB document database"

  # ---------------------------------------------------------------------------
  # REDIS — In-Memory Cache & Message Broker
  # ---------------------------------------------------------------------------
  # WHAT IT DOES:
  #   Redis stores application cache and session data.
  #
  # PERSISTENCE NOTE:
  #   This config enables AOF and stores it in the bind-mounted /data directory.
  # ---------------------------------------------------------------------------
  redis:
    container_name: redis
    image: redis:7.2-alpine
    profiles: ["infra", "all"]

    # --requirepass enforces authentication on all connections.
    # NEW DEV: If your app gets "NOAUTH" errors, you forgot to provide the password.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis123}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis:/data

    ports:
      # Exposed for local debugging with redis-cli or Redis Insight.
      # Host 6381 -> Container 6379. Not the usual 6379, because other projects on
      # this machine already publish 6379 and 6380. The app reads REDIS_PORT.
      - "6381:6379"

    healthcheck:
      # '-a' provides the password. Redis returns PONG if healthy.
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 64M

    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    networks:
      - milvus

    labels:
      - "project=healthcare-chatbot"
      - "service=redis"
      - "description=Healthcare Chatbot - Redis cache service"

# =============================================================================
# NETWORKS
# =============================================================================
# We define a custom bridge network for three reasons:
#   1. ISOLATION: Services can only communicate if on the same network.
#   2. DNS DISCOVERY: Containers are reachable by service name (e.g., 'redis').
#   3. SECURITY: No external access except explicitly mapped ports.
#
# NEW DEV: If you add a new service (e.g., your Python FastAPI app), add
# 'networks: - milvus' so it can reach Milvus and Redis by hostname.
# =============================================================================
networks:
  milvus:
    name: healthcare-chatbot-network
    driver: bridge
    labels:
      - "project=healthcare-chatbot"
      - "description=Healthcare Chatbot Infrastructure Network"

# =============================================================================
# VOLUMES (Implicit)
# =============================================================================
# We use BIND MOUNTS (host directory -> container path) rather than named
# volumes for one critical reason: BACKUP SIMPLICITY.
#
#   Named volume:  docker volume inspect healthcare-chatbot_milvus_data
#   Bind mount:    ./volumes/milvus/  (visible in your project folder)
#
# Bind mounts let you:
#   - Zip the ./volumes/ folder for offline backups.
#   - Back up or inspect individual service directories before changing them.
#   - Inspect files directly with standard OS tools.
#
# NEW DEV: The ./volumes/ directory is in .gitignore. Never commit database
# files to Git — they are large and contain sensitive data.
# =============================================================================

# =============================================================================
# .env FILE TEMPLATE (Save as .env in the same directory)
# =============================================================================
# # --- Host Path Configuration ---
# DOCKER_VOLUME_DIRECTORY=.
#
# # --- MinIO Object Storage ---
# MINIO_ROOT_USER=minioadmin
# MINIO_ROOT_PASSWORD=ChangeMeToASecurePassword123!
#
# # --- Redis Authentication ---
# REDIS_PASSWORD=ChangeMeToASecurePassword789!
# =============================================================================
