# OpenAI Embedding Configuration
# These must match the application: OPENAI_EMBEDDING_MODEL and MILVUS_EMBEDDING_DIMENSION.
# Changing either one means re-running ingestion, because query vectors and stored
# vectors must come from the same model and dimensions.
openai:
  api_key: "${OPENAI_API_KEY}"  # Use environment variable
  model_name: "text-embedding-3-small"
  dimensions: 768  # Must match milvus.collection.embedding_dimension
  batch_size: 100  # Texts per embedding request
  retry_attempts: 3  # Retries on rate limits and transient errors
  timeout_seconds: 60

# Milvus Configuration
milvus:
  # Connection settings
  connection:
    host: "localhost"
    port: 19530
    alias: "default"
    timeout: 30

    # Authentication (if enabled)
    user: ""
    password: ""


  # Collection settings
  collection:
    name: "pharmaceutical_drugs"
    description: "Pharmaceutical drug database with embeddings for LLM lookup"
    drop_existing: true  # WARNING: Set to true to recreate collection
    embedding_dimension: 768  # Must match openai.dimensions

    # Schema configuration
    # NOTE: the field list, max_lengths and types live in Python, in
    # MilvusCollectionManager._create_collection_schema(). They were duplicated
    # here but silently ignored, so the YAML copy has been removed.
  # Index configuration
  index:
    # Index type options:
    # - FLAT: Exact search, 100% accuracy, slow for large datasets
    # - IVF_FLAT: Fast approximate search, good accuracy
    # - IVF_SQ8: Memory-efficient, quantized version
    # - IVF_PQ: Most memory-efficient, lower accuracy
    # - HNSW: Best accuracy/speed tradeoff, higher memory
    # - AUTOINDEX: Automatic selection based on data
    type: "HNSW"

    # Metric type options:
    # - IP: Inner product (recommended for normalized embeddings - same as cosine similarity)
    # - L2: Euclidean distance
    metric_type: "IP"

    # Index-specific parameters
    params:
      # For HNSW
      M: 16                    # Number of connections per node (8-64, higher = better accuracy, more memory)
      efConstruction: 200      # Build-time search depth (100-500, higher = better index quality, slower build)

      # For IVF_FLAT / IVF_SQ8 / IVF_PQ
      nlist: 128               # Number of clusters (64-1024, higher = better accuracy, slower search)

      # For IVF_PQ
      m: 8                     # Number of subquantizers (dimension must be divisible by m)
      nbits: 8                 # Bits per subvector

  # Search configuration
  # NOTE: search-time settings (top_k, ef, output_fields) belong to the
  # application, not the ingestion pipeline. See MILVUS_SEARCH_* in src/config.py.
  # Insertion configuration
  insertion:
    batch_size: 100            # Records per batch insert

  performance:
    # Load the collection into memory once ingestion finishes.
    load_on_startup: true


# Search Text Generation Configuration
# =============================================================================
# This is the single definition of the text that gets embedded. The same string is
# sent to OpenAI, stored in the Milvus search_text column, and written to the
# standardized CSV.
#
# Segments render in order and are joined with `separator`. A segment whose
# placeholders are all empty is DROPPED, so a drug with no dosage or route does not
# carry "Dosages: [] | Form:  | Route: " filler into its embedding. Only about 5% of
# records have every field populated, so this matters for most of the corpus.
#
# Available placeholders: drug_name, dosages, formulation, route, drug_class,
# drug_sub_class, therapeutic_category. An unknown one is rejected when the config
# loads, before any embedding is paid for.
#
# WARNING: editing anything here changes every embedding. Re-run ingestion with
# milvus.collection.drop_existing=true afterwards, or queries will be comparing
# vectors built from two different formats.
# =============================================================================
search_text:
  separator: " | "
  dosage_delimiter: ", "

  segments:
    - "Drug: {drug_name}"
    - "Dosages: [{dosages}]"
    - "Form: {formulation}"
    - "Route: {route}"
    - "Class: {drug_class}"
    - "Subclass: {drug_sub_class}"
    - "Therapeutic: {therapeutic_category}"


# Error Handling
error_handling:
  # How many input files may fail before the ETL run is abandoned. Exceeding this
  # raises instead of quietly ingesting a partial dataset.
  max_errors: 2
